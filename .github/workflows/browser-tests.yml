# The BROWSER GATE of this repository.
#
# `npm test` alone cannot gate the browser paths: on a host without a browser
# the browser-USE seam test and the shared-chromium-launcher test SKIP, so the
# suite is green even when the browser code is broken. This workflow runs the
# SAME suite with `BROWSER_USE_REQUIRE_BROWSER=1` (`npm run test:browser`), where
# an unavailable browser is a FAILURE - and it runs it inside the SEPARATE,
# browser-capable image (`mcr.microsoft.com/playwright`, i.e. the image family
# the deployment uses for its browser service), never inside the workbench image,
# which ships no browser at all.
name: browser tests

on:
  push:
    branches: [stable]
  pull_request:
    branches: [stable]
  workflow_dispatch:

jobs:
  browser-suite:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install (locked)
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      # `shell: bash` is REQUIRED: a `run:` step of a container job is executed with
      # `sh -e {0}`, and in this image /bin/sh is dash, which has NO `pipefail` and
      # aborts on `set -o pipefail` before npm is ever reached (the gate would then
      # "fail" in zero seconds without running the suite).
      - name: Suite WITH a real browser (a skip is a failure)
        shell: bash
        run: |
          set -euo pipefail
          BROWSER_USE_CHROMIUM="$(find /ms-playwright -maxdepth 3 -name chrome -path '*chrome-linux64*' -print -quit)"
          if [ -z "${BROWSER_USE_CHROMIUM}" ]; then
            echo "no chromium binary found under /ms-playwright" >&2
            ls -la /ms-playwright >&2 || true
            exit 1
          fi
          export BROWSER_USE_CHROMIUM
          echo "chromium: ${BROWSER_USE_CHROMIUM}"
          npm run test:browser
