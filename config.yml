# Development config for the workbench SERVICE (docker compose, dev).
#
# The dev overlay passes this file as CONFIG_FILE
# (docker-compose.dev.yml: CONFIG_FILE=/opt/workspace/workbench-plugins/config.yml)
# and the service maps /opt in-and-out, so this path resolves identically inside
# and outside the container.
#
# In production the service uses the tracked omni-root config
# (config/workbench.yml -> /opt/omni/config/workbench.yml), where this repository
# is a REMOTE git source instead of the local checkout used here.
sources:
  # core plugins: the sibling core checkout, edited live during development
  - kind: path
    id: core
    path: ../workbench/plugins
    external: false
  # THIS repository, referenced LOCALLY: a plugin under development is picked up
  # at the next boot, with no clone and no push.
  - kind: path
    id: workbench-plugins
    path: ./plugins
  # An EXTERNAL git source, the production shape: this repository is cloned from
  # GitHub into the core's cache (`WORKBENCH_CACHE_DIR`, /var/lib/workbench/sources
  # in the service image) and the `examples` subtree is scanned for plugins. The
  # plugin under examples/ is therefore reachable ONLY after a real clone, which
  # is what makes "external git plugin sources work" observable in dev.
  - kind: git
    id: workbench-plugins-git
    url: https://github.com/nexuslbs/workbench-plugins
    ref: main
    subdir: examples
  # A PRIVATE repository, the shape the operator asked for: the config carries a
  # credential REFERENCE BY NAME (never a value). It is resolved BEFORE any
  # plugin is loaded - a source is fetched before plugin discovery, so the
  # credential can only come from the BOOTSTRAP set below (core providers, no
  # plugin). See docs/CREDENTIALS.md (layering) and docs/PLUGIN-CONTRACT.md.
  - kind: git
    id: workbench-plugins-private
    url: https://github.com/nexuslbs/workbench-plugins-private
    ref: main
    subdir: plugins
    auth:
      # github-app: the credential value is an App PRIVATE KEY (PEM); the core
      # mints a short-lived installation token from it (RS256 JWT) for the fetch.
      type: github-app
      credential: GITHUB_APP_KEY
      appId: 3967918
      installationId: 138119822

# Credentials provider SELECTION. `bootstrap` is the set usable BEFORE any
# plugin is loaded: exactly what a source fetch needs. `env` is listed first (a
# directly exported value beats a file), then `file` for the PEM (a multiline
# value is awkward in an env var).
credentials:
  bootstrap:
    - env
    - file

# THE ROSTER (breaking change): `plugins:` is the ENABLE LIST. A plugin is
# LOADED only when it is named here; every other plugin discovered in `sources:`
# is merely AVAILABLE - listed by `workbench plugins` and by the Plugin Inventory
# page, where it can be enabled in one click (which persists its row here).
# A row with `disabled: true` PARKS a plugin (configured, deliberately off).
# A config written for the old scan-and-load semantics must therefore list every
# plugin it wants loaded (see README.md, "The plugin roster").
plugins:
  credentials-file:
    # Operator-provided and gitignored, OUTSIDE both repositories (see
    # .env.example). Absent file = "not found": the private source then reports a
    # clear auth error and every OTHER source still loads.
    path: /opt/workspace/workbench-secrets/credentials.yml
  hello-world:
    message: Hello World
  hello-otherworld:
    message: Hello Otherworld

  # The TOOL consumer: registers the by-name tool `hello greet` through
  # `ctx.workbench.registerTool` (core docs/PLUGIN-CONTRACT.md, section 4d), so
  # the dev service answers GET /api/tools, POST /api/tools/hello%20greet and
  # POST /api/tool/call (the shape the omniagent `workbench` MCP plugin sends).
  hello-tool: {}

  # Web UI (M1 Plugin Inventory, M2 Plugin Manager, M3 Settings, M4 Cordis UI).
  # The UI is composed ONLY of plugins: they are discovered in the sources above
  # and named here, nothing is hardcoded in the core. Drop a row (or set
  # `disabled: true`) and that page is gone while the others keep working;
  # remove `web.enabled` (or set it to false) and the service keeps its
  # pre-Web-UI behaviour. `workbench web` is the explicit serve entrypoint,
  # `workbench serve` starts the listener too when it is enabled.
  plugin-inventory: {}
  plugin-manager: {}
  settings: {}
  cordis-ui: {}
  # credentials-stub: the dev credential provider plugin (the stub vault the docs
  # use to show the Provider -> Definition <- Consumer seam end to end).
  credentials-stub: {}

  # The plugin of the EXTERNAL GIT source (`workbench-plugins-git`, subdir
  # `examples`): cloned from GitHub at boot, so naming it here is what keeps the
  # real clone path exercised in dev.
  git-source-demo: {}

web:
  enabled: true
  # Inside the compose service the listener must not bind the container's
  # loopback only: the UI has no auth in this round, so the DEFAULT is
  # 127.0.0.1 and the dev service opts into 0.0.0.0 explicitly (and still needs
  # a published port to be reachable from the host).
  host: 0.0.0.0
  # 8080 is the container-INTERNAL status port; the dev overlay publishes it on
  # the host as `12347:8080`, and the compose healthcheck probes `/health`
  # there. When the web port equals the
  # status port, `workbench serve` starts ONE listener that serves the browser UI
  # and answers `/health` on the same port, so the operator-visible URL is the
  # documented workbench port and nothing else has to be published.
  port: 8080
