# Development config for the workbench SERVICE (docker compose, dev).
#
# The dev overlay passes this file as CONFIG_FILE
# (docker-compose.dev.yml: CONFIG_FILE=/opt/workspace/workbench-plugins/config.yml)
# and the service maps /opt in-and-out, so this path resolves identically inside
# and outside the container.
#
# In production the service uses the tracked omni-root config
# (config/workbench.yml -> /opt/omni/config/workbench.yml), where this repository
# is a REMOTE git source instead of the local checkout used here.
sources:
  # core plugins: the sibling core checkout, edited live during development
  - kind: path
    id: core
    path: ../workbench/plugins
    external: false
  # THIS repository, referenced LOCALLY: a plugin under development is picked up
  # at the next boot, with no clone and no push.
  - kind: path
    id: workbench-plugins
    path: ./plugins
  # An EXTERNAL git source, the production shape: this repository is cloned from
  # GitHub into the core's cache (`WORKBENCH_CACHE_DIR`, /var/lib/workbench/sources
  # in the service image) and the `examples` subtree is scanned for plugins. The
  # plugin under examples/ is therefore reachable ONLY after a real clone, which
  # is what makes "external git plugin sources work" observable in dev.
  - kind: git
    id: workbench-plugins-git
    url: https://github.com/nexuslbs/workbench-plugins
    ref: main
    subdir: examples
  # A PRIVATE repository, the shape the operator asked for: the config carries a
  # credential REFERENCE BY NAME (never a value). It is resolved BEFORE any
  # plugin is loaded - a source is fetched before plugin discovery, so the
  # credential can only come from the BOOTSTRAP set below (core providers, no
  # plugin). See docs/CREDENTIALS.md (layering) and docs/PLUGIN-CONTRACT.md.
  - kind: git
    id: workbench-plugins-private
    url: https://github.com/nexuslbs/workbench-plugins-private
    ref: main
    subdir: plugins
    auth:
      # github-app: the credential value is an App PRIVATE KEY (PEM); the core
      # mints a short-lived installation token from it (RS256 JWT) for the fetch.
      type: github-app
      credential: GITHUB_APP_KEY
      appId: 3967918
      installationId: 138119822

# Credentials provider SELECTION. `bootstrap` is the set usable BEFORE any
# plugin is loaded: exactly what a source fetch needs. `env` is listed first (a
# directly exported value beats a file), then `file` for the PEM (a multiline
# value is awkward in an env var).
credentials:
  bootstrap:
    - env
    - file

# THE ROSTER (breaking change): `plugins:` is the ENABLE LIST. A plugin is
# LOADED only when it is named here; every other plugin discovered in `sources:`
# is merely AVAILABLE - listed by `workbench plugins` and by the Plugin Inventory
# page, where it can be enabled in one click (which persists its row here).
# A row with `disabled: true` PARKS a plugin (configured, deliberately off).
# A config written for the old scan-and-load semantics must therefore list every
# plugin it wants loaded (see README.md, "The plugin roster").
plugins:
  credentials-file:
    # Operator-provided and gitignored, OUTSIDE both repositories (see
    # .env.example). Absent file = "not found": the private source then reports a
    # clear auth error and every OTHER source still loads.
    path: /opt/workspace/workbench-secrets/credentials.yml
  hello-world:
    message: Hello World
  hello-otherworld:
    message: Hello Otherworld

  # The TOOL consumer: registers the by-name tool `hello greet` through
  # `ctx.workbench.registerTool` (core docs/PLUGIN-CONTRACT.md, section 4d), so
  # the dev service answers GET /api/tools, POST /api/tools/hello%20greet and
  # POST /api/tool/call (the shape the omniagent `workbench` MCP plugin sends).
  hello-tool: {}

  # Web UI (M1 Plugin Inventory, M2 Plugin Manager, M3 Settings, M4 Cordis UI).
  # The UI is composed ONLY of plugins: they are discovered in the sources above
  # and named here, nothing is hardcoded in the core. Drop a row (or set
  # `disabled: true`) and that page is gone while the others keep working;
  # remove `web.enabled` (or set it to false) and the service keeps its
  # pre-Web-UI behaviour. `workbench web` is the explicit serve entrypoint,
  # `workbench serve` starts the listener too when it is enabled.
  plugin-inventory: {}
  plugin-manager: {}
  settings: {}
  cordis-ui: {}
  # credentials-stub: the dev credential provider plugin (the stub vault the docs
  # use to show the Provider -> Definition <- Consumer seam end to end).
  credentials-stub: {}
  # The WEB-PAGE reader: ONE-call JS-aware read of a page that needs JavaScript.
  # The plugin renders through playwright-core chromium (the browser is provided
  # by the deployment: `PLAYWRIGHT_BROWSERS_PATH` here points at the browser
  # installed for local runs, config `executablePath` overrides it), distils the
  # page to compact markdown IN CODE, caps the result with spill to a file and
  # caches it by URL + content hash. Two CONSUMER tools through
  # `ctx.workbench.registerTool`: 'page read' and 'page map'. It holds no
  # credential of its own - the optional `proxy.credential` is a NAME resolved
  # through ctx.credentials and never written or logged.
  web-page:
    cacheDir: /opt/workspace/workbench-plugins/.workbench/web-page-cache
    cacheTtlSeconds: 900
    # The READ-THROUGH of the recipe store below (plugins/web-recipe): a usable
    # recipe for the domain is consulted BEFORE the browser is launched - its
    # discovered API endpoint when it has one, else its saved selectors. Both
    # gates are spelled out, and `record` is OFF on purpose: recipes stay
    # curated, not accidental.
    recipes:
      enabled: true
      record: false

  # The per-domain RECIPE STORE (see plugins/web-recipe/README.md): durable,
  # agent-agnostic knowledge about a site (read path, named selectors,
  # discovered JSON endpoints, login flow by credential NAME, quirks) in ONE
  # human-readable JSON file per domain. It PROVIDES the cordis service
  # `web-recipe` (contract web-recipe@1) that web-page consumes, and registers
  # the tools 'recipe get', 'recipe save', 'recipe list', 'recipe delete' and
  # 'recipe verify'. `.workbench/` is git-ignored, so recipes are local state.
  web-recipe:
    dir: /opt/workspace/workbench-plugins/.workbench/web-recipe
    minConfidence: 0.2
    maxAgeDays: 0
    demoteOnFailure: true
    demoteStep: 0.2
    acceptRecords: true
    verifyTimeoutMs: 10000

  # The SESSION tool (see plugins/web-session/README.md): ONE multiplexed
  # browser tool `session` with an ACTION ENUM (open | act | read | close)
  # instead of one tool per browser verb - the tool schema is paid for in every
  # prompt, so the surface stays small. It keeps a per-site playwright context
  # whose storage state (cookies + localStorage) is PERSISTED to
  # `<stateDir>/state/<label>.json` (git-ignored, 0600) so a session survives a
  # process restart; an expired session is re-established from the `credential`
  # NAMEs of its declared login flow (resolved at login time through
  # ctx.credentials, never logged, echoed or persisted). `act` answers a DELTA
  # (what changed) instead of the page, `read` takes a CSS/XPath/role+name
  # selector (or returns a bounded outline), and `read {api: "list"}` exposes the
  # site's discovered JSON/XHR endpoints so a follow-up read can call the API
  # directly. It shares chromium with web-page through plugins/web-shared, so the
  # two plugins never launch two browsers. No per-site knowledge is hardcoded
  # here: `sites` is the whole site table.
  web-session:
    stateDir: /opt/workspace/workbench-plugins/.workbench/web-session
    idleTtlSeconds: 900
    maxSessions: 4
    defaultSite: demo
    sites:
      # `demo` is the LOCAL SPA fixture the end-to-end gate serves
      # (/opt/workspace/tmp/<task>/server.mjs): a login form, a JSON API and a
      # JS-rendered list. Point `baseUrl` at a real site for a real deployment;
      # the login flow below is config, not code, and the two credential NAMEs
      # resolve through the credentials provider (the operator puts them in the
      # gitignored workbench-secrets/credentials.yml).
      demo:
        baseUrl: http://127.0.0.1:12538/
        login:
          url: /login
          indicator: '#login-form'
          fields:
            - name: user
              selector: '#user'
              credential: WBSESSION_USER
            - name: pass
              selector: '#pass'
              credential: WBSESSION_PASSWORD
          submit: '#submit'
          success:
            selector: '#app'

  # The plugin of the EXTERNAL GIT source (`workbench-plugins-git`, subdir
  # `examples`): cloned from GitHub at boot, so naming it here is what keeps the
  # real clone path exercised in dev.
  git-source-demo: {}

  # The EMAIL capability (core docs/PLUGIN-CONTRACT.md 4e): the PROVIDER below
  # implements `email@1` on top of the himalaya CLI, the CONSUMER exposes it as
  # the tools 'email accounts', 'email list', 'email get' and 'email code'.
  # The accounts are placeholders: himalaya itself must be installed AND those
  # mailboxes configured with `himalaya account configure <name>` (see
  # plugins/email-himalaya/README.md). `credential` is a NAME, resolved at call
  # time through ctx.credentials; no value is ever written here.
  email-himalaya:
    defaultAccount: personal
    accounts:
      personal:
        address: me@example.com
        accountName: personal
        credential: EMAIL_PERSONAL_PASSWORD
      work:
        address: me@work.example
        accountName: work
  email-tools:
    defaultLimit: 10

  # THE TRANSPORT PROVIDERS of the general-service stack (definitions/*.ts +
  # docs/SERVICES.md): ONE plugin per transport, each declaring its capability
  # provider id in its manifest. They are independent: a deployment loads only
  # the transports it uses, the config-driven dispatcher below resolves by type.
  # `shell-impl` is the ONLY provider that executes on the WORKBENCH HOST and it
  # is OPT-IN: drop its row and `local` stops working while every remote type
  # keeps working (plugins/shell-impl/README.md).
  shell-impl: {}
  ssh-impl: {}
  docker-impl: {}
  http-impl: {}
  # THE CONFIG-DRIVEN DISPATCHER (general-service@1): resolves the transport
  # service from the configured `type` (local -> shell, container -> docker,
  # ssh -> ssh, ssh+container -> ssh + docker, http -> http) and calls it. NO
  # hard injection: transports it does not use need not be loaded at all.
  general-service-impl: {}
  # THE HIMALAYA PROVIDER (himalaya@1): it owns the TRANSPORT and never the mail
  # accounts (those belong to the email plugin). `type: container` runs himalaya
  # INSIDE the omni toolbox of this stack; project_dir/service come from HERE,
  # never from code: `${env:OMNI_DIR}` is the omni root of the deployment (the
  # container transport needs docker@1 + a reachable compose project).
  himalaya-impl:
    general:
      type: container
      params:
        engine: docker-compose
        compose:
          project_dir: ${env:OMNI_DIR}
          service: toolbox

  # The TOTP capability (core docs/PLUGIN-CONTRACT.md 4f): the PROVIDER below
  # implements `totp@1` with RFC 4226 (HOTP) + RFC 6238 (TOTP) on `node:crypto`
  # HMAC only (no dependency), the CONSUMER exposes it as the tools
  # 'totp list' (labels + metadata, never a secret) and 'totp code'.
  #
  # NO KEY VALUE IS IN THIS FILE. `credential: NAME` is a credential NAME,
  # resolved at CALL time through ctx.credentials, so a credential that is not in
  # the store leaves the plugin LOADED and only THAT entry 'not configured' (a
  # call for it reports the reason). The `${cred:NAME}` spelling is supported too
  # and is the PREFERRED form when the credential is guaranteed to exist: the
  # core expands it BEFORE the plugin loads (plugin README, "Configuration").
  # `rfc-test-vector` carries the PUBLIC RFC 6238 appendix B test key, which is
  # not a credential at all: it keeps the seam demonstrable with an empty store.
  totp-rfc6238:
    entries:
      github:
        credential: TOTP_GITHUB_KEY
        issuer: GitHub
        account: me@example.com
      aws-root:
        credential: TOTP_AWS_ROOT_KEY
        issuer: AWS
        account: root
      rfc-test-vector:
        secret: GEZDGNBVGY3TQOJQGEZDGNBVGY3TQOJQ
        issuer: RFC 6238
        account: appendix-b
        digits: 8
  totp-tools:
    reportEntryMetadata: true

  # The SMS capability (core docs/PLUGIN-CONTRACT.md 4g): the PROVIDER below
  # implements `sms@1` READ-ONLY on the Twilio REST API 2010-04-01 (Messages
  # resource, GET only - no sending, no webhook, no number provisioning), the
  # CONSUMER exposes it as the tools 'sms numbers', 'sms list', 'sms get' and
  # 'sms code'.
  #
  # The numbers are placeholders and NO TOKEN VALUE IS IN THIS FILE: `authToken`
  # is a credential NAME, resolved at CALL time through ctx.credentials. The
  # `${cred:NAME}` spelling is supported too (the plugin resolves both forms) and
  # is preferred when the credential is GUARANTEED to exist: the core expands it
  # BEFORE the plugins load, and a missing one aborts the boot - which is why the
  # rows below, like the totp/email rows, use the plain NAME form so the dev
  # config boots with an empty credential store. The required credential NAMES are
  # TWILIO_PERSONAL_TOKEN and TWILIO_WORK_TOKEN; with them absent the plugin
  # stays LOADED and reports every number `configured: false` - only a call for
  # one of them fails.
  sms-twilio:
    defaultNumber: personal
    numbers:
      personal:
        number: "+15551234567"
        accountSid: ACxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
        authToken: TWILIO_PERSONAL_TOKEN
        description: personal phone
      work:
        number: "+15557654321"
        accountSid: ACyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyy
        authToken: TWILIO_WORK_TOKEN
    timeoutMs: 8000
    maxPages: 3
  sms-tools:
    defaultListLimit: 10
    maxListLimit: 50
    includeBodies: true

web:
  enabled: true
  # Inside the compose service the listener must not bind the container's
  # loopback only: the UI has no auth in this round, so the DEFAULT is
  # 127.0.0.1 and the dev service opts into 0.0.0.0 explicitly (and still needs
  # a published port to be reachable from the host).
  host: 0.0.0.0
  # 8080 is the container-INTERNAL status port; the dev overlay publishes it on
  # the host as `12347:8080`, and the compose healthcheck probes `/health`
  # there. When the web port equals the
  # status port, `workbench serve` starts ONE listener that serves the browser UI
  # and answers `/health` on the same port, so the operator-visible URL is the
  # documented workbench port and nothing else has to be published.
  port: 8080
