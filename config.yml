# Development config for the workbench SERVICE (docker compose, dev).
#
# The dev overlay passes this file as CONFIG_FILE
# (docker-compose.dev.yml: CONFIG_FILE=/opt/workspace/workbench-plugins/config.yml)
# and the service maps /opt in-and-out, so this path resolves identically inside
# and outside the container.
#
# In production the service uses the tracked omni-root config
# (config/workbench.yml -> /opt/omni/config/workbench.yml), where this repository
# is a REMOTE git source instead of the local checkout used here.
sources:
  # NO core plugin source: the core repo (nexuslbs/workbench) ships ZERO plugins
  # since v0.0.2 - every plugin, including this repository's, is EXTERNAL.
  # THIS repository, referenced LOCALLY: a plugin under development is picked up
  # at the next boot, with no clone and no push.
  #
  # THIS repository has TWO plugin trees, so it has TWO sources:
  #   * `./core`    - the CORE SERVICE IMPLEMENTATIONS: the `{id, version,
  #                   provider}` capability providers and the service hosts of
  #                   `definitions/` (credentials, logger sinks, tools, web,
  #                   shell, docker, ssh, http, general-service, himalaya, email,
  #                   sms, totp, capabilities-host). Listing them first keeps the
  #                   `credentials` provider discoverable before any gated source
  #                   or plugin is resolved;
  #   * `./plugins` - the consumers, the operator tools and the Web UI plugins.
  # Both trees are discovered here and the `plugins:` ROSTER below names every
  # plugin by NAME (never by path), so the LOADED SET is unchanged by the split.
  - kind: path
    id: workbench-plugins-core
    path: ./core
  - kind: path
    id: workbench-plugins
    path: ./plugins
  # An EXTERNAL git source, the production shape: this repository is cloned from
  # GitHub into the core's cache (`WORKBENCH_CACHE_DIR`, /var/lib/workbench/sources
  # in the service image) and the `examples` subtree is scanned for plugins. The
  # plugin under examples/ is therefore reachable ONLY after a real clone, which
  # is what makes "external git plugin sources work" observable in dev.
  - kind: git
    id: workbench-plugins-git
    url: https://github.com/nexuslbs/workbench-plugins
    ref: main
    subdir: examples
  # A PRIVATE repository, the shape the operator asked for: the config carries a
  # credential REFERENCE BY NAME (never a value). It is resolved through the
  # credentials SERVICE, whose implementation is a PLUGIN (credentials-basic
  # below) - the CORE ships the credentials DEFINITION only, never a provider.
  # The GATE is what makes this source work: sources that need NO credential are
  # walked FIRST (that is where the provider plugin comes from) and THIS source
  # is DEFERRED until such a plugin is loaded. See docs/CREDENTIALS.md
  # (section 6, the GATE) and docs/PLUGIN-CONTRACT.md.
  - kind: git
    id: workbench-plugins-private
    url: https://github.com/nexuslbs/workbench-plugins-private
    ref: main
    subdir: plugins
    auth:
      # github-app: the credential value is an App PRIVATE KEY (PEM); the PLUGIN
      # core/credentials-github-app turns it into a short-lived installation
      # token (RS256 JWT) for the fetch. The core mints nothing and branches on
      # no auth type: it dispatches to the strategy a plugin registered on the
      # credentials service. That plugin must be in the roster below (it is).
      type: github-app
      credential: GITHUB_APP_KEY
      appId: 3967918
      installationId: 138119822

# Credentials provider SELECTION: WHICH declared providers may answer, and in
# which order. The loader reads `credentials.providers` ONLY (list order =
# precedence) and there is NO core provider: the core ships the credentials
# DEFINITION, every implementation is a PLUGIN. With NO `credentials:` key - as
# here - every provider a LOADED plugin declares is enabled: `env` first (a
# directly exported value beats a file) and `file` for the PEM (a multiline
# value is awkward in an env var). Both are declared by the `credentials-basic`
# plugin row below. To narrow or reorder the set, name the providers explicitly:
#   credentials:
#     providers: [env, file]     # precedence = list order
# A `credentials.bootstrap` key from an older config is DEAD: no core code path
# reads it (see the core docs/CREDENTIALS.md, section 6).

# THE ROSTER (breaking change): `plugins:` is the ENABLE LIST. A plugin is
# LOADED only when it is named here; every other plugin discovered in `sources:`
# is merely AVAILABLE - listed by `workbench plugins` and by the Plugin Inventory
# page, where it can be enabled in one click (which persists its row here).
# A row with `disabled: true` PARKS a plugin (configured, deliberately off).
# A config written for the old scan-and-load semantics must therefore list every
# plugin it wants loaded (see README.md, "The plugin roster").
plugins:
  credentials-basic:
    # The credentials@1 PROVIDER (a plugin, since the core ships none): `file` is
    # the file backend, `env` the direct process environment. The path is
    # operator-provided and gitignored, OUTSIDE both repositories (see
    # .env.example). An absent file = "not found": the private source then reports
    # a clear auth error and every OTHER source still loads.
    file:
      path: /opt/workspace/workbench-secrets/credentials.yml
  hello-world:
    message: Hello World
  hello-otherworld:
    message: Hello Otherworld

  # The TOOL consumer: registers the by-name tool `hello greet` through
  # `ctx.tools.registerTool` (the tools@1 service, plugins repo docs), so
  # the dev service answers GET /api/tools, POST /api/tools/hello%20greet and
  # POST /api/tool/call (the shape the omniagent `workbench` MCP plugin sends).
  hello-tool: {}

  # THE TOOLS PROVIDER (tools@1, provider `registry`): it owns the named-tool
  # registry, the /api/tools* HTTP seams on the web seam and the `workbench
  # tools` / `workbench tool <name>` CLI commands. The CORE ships NO tool module
  # at all since v0.0.4 (definitions/tools.ts + this provider live in THIS
  # repository): a consumer registers through `ctx.tools`.
  tools-impl: {}


  # THE LOGGER SINKS (`logger@1`, plugins repo docs/LOGGING.md). The core hosts
  # the cordis logger SERVICE (`ctx.logger`, which EVERY context already
  # installs) and ships NO exporter, no formatter and no console.* call of its
  # own: with no sink rostered the process prints NO log line at all - that is
  # the model, not a bug. Every output is a SEPARATE plugin with its OWN row
  # (one sink = one plugin, never a monolithic logger plugin): drop a row (or
  # set `disabled: true`) and only that sink disappears while every plugin keeps
  # logging through the service.
  logger-console:
    level: info
  logger-jsonl:
    level: info
    path: /opt/workspace/workbench-plugins/.workbench/logs/workbench.jsonl
  # The third sink shape: a bounded in-memory ring published as the `logs`
  # service and readable over the web seam (GET /api/logs, /api/logs/tail).
  logger-ring:
    level: info
    size: 500
  # plugins/logger-demo is NOT a sink: it is the drive surface (`GET
  # /api/logger/demo?count=N&name=<logger>&level=<level>`). It is left OUT of
  # this roster on purpose - every gate that needs it writes its own row.
  # Web UI (M1 Plugin Inventory, M2 Plugin Manager, M3 Settings, M4 Cordis UI).
  # The UI is composed ONLY of plugins: they are discovered in the sources above
  # and named here, nothing is hardcoded in the core. Drop a row (or set
  # `disabled: true`) and that page is gone while the others keep working;
  # remove `web.enabled` (or set it to false) and the service keeps its
  # pre-Web-UI behaviour. `workbench web` is the explicit serve entrypoint,
  # `workbench serve` starts the listener too when it is enabled.
  plugin-inventory: {}
  plugin-manager: {}
  settings: {}
  cordis-ui: {}
  # THE CONFIG WATCHER (plugins/config-watch, contract config-watch@1): it
  # watches the ACTIVE config file (the SAME file the core loaded: --config /
  # CONFIG_FILE / the default search order) and its directory, so an EXTERNAL
  # edit - `vi config.yml`, `sed -i`, an atomic write+rename - is applied LIVE
  # through the core's `host.reconcile()`: no restart, no HTTP lifecycle call.
  # It is OPT-IN: with no row (or `disabled: true`) the process opens NO fs
  # handle at all. `debounceMs` coalesces a burst of writes; `minIntervalMs`
  # rate-limits applies; both are bounded and the plugin state
  # (`GET /api/config-watch/state`) reports the last event, the last reconcile
  # report, the last error and the counters. Self-writes (settings patch,
  # enable/disable/install/uninstall) cannot loop: an unchanged BYTE-IDENTICAL
  # rewrite is suppressed by content hash and reconcile itself never writes the
  # file, so the worst case is one no-op apply.
  config-watch:
    debounceMs: 300
    minIntervalMs: 1000
  # THE WEB PROVIDER (`web@1`, provider `http`). The core ships NO web module
  # since v0.0.3: the socket, the shell and the `/health` endpoint belong to this
  # plugin. Port precedence is the plugin row, then $WORKBENCH_WEB_PORT, then
  # $WORKBENCH_PORT - and the core publishes the `web:` section at the bottom of
  # this file to those variables BEFORE the plugins load, so a deployment keeps
  # configuring the UI in one place. With no web provider loaded the core reports
  # the web UI as DEFERRED (structured state, no crash) and keeps running.
  web-impl:
    host: 0.0.0.0
    port: 8080
  # credentials-stub: the dev credential provider plugin (the stub vault the docs
  # use to show the Provider -> Definition <- Consumer seam end to end).
  credentials-stub: {}
  # THE github-app GIT AUTH STRATEGY (moved out of the core in v0.0.4): it turns
  # the App PRIVATE KEY that a credentials PROVIDER resolved for
  # `auth.credential` into a short-lived installation token and hands the core
  # the `git -c ...` arguments. It declares the `credentials` capability WITHOUT a
  # provider id - that declaration is what loads it in the core's credentials
  # phase, BEFORE any gated source is resolved - because the VALUE comes from the
  # providers above and this plugin only mints from it.
  credentials-github-app: {}
  # The WEB-PAGE reader: ONE-call JS-aware read of a page that needs JavaScript.
  # The plugin renders through playwright-core chromium (the browser is provided
  # by the deployment: `PLAYWRIGHT_BROWSERS_PATH` here points at the browser
  # installed for local runs, config `executablePath` overrides it), distils the
  # page to compact markdown IN CODE, caps the result with spill to a file and
  # caches it by URL + content hash. Two CONSUMER tools through
  # `ctx.tools.registerTool`: 'page read' and 'page map'. It holds no
  # credential of its own - the optional `proxy.credential` is a NAME resolved
  # through ctx.credentials and never written or logged.
  web-page:
    cacheDir: /opt/workspace/workbench-plugins/.workbench/web-page-cache
    cacheTtlSeconds: 900
    # The READ-THROUGH of the recipe store below (plugins/web-recipe): a usable
    # recipe for the domain is consulted BEFORE the browser is launched - its
    # discovered API endpoint when it has one, else its saved selectors. Both
    # gates are spelled out, and `record` is OFF on purpose: recipes stay
    # curated, not accidental.
    recipes:
      enabled: true
      record: false
  # The WEB-SEARCH seam (definitions/web-search.ts, contract `web-search@1`):
  # workbench could FETCH a page but had no SEARCH. FIVE plugins make the seam,
  # all in THIS repository (the core is untouched):
  #   * web-search-impl   the SERVICE HOST: engine registry, the execution-time
  #                       selection + fallback chain, the result COUNT cap and
  #                       the overflow SPILL (it consumes `spill@1` when a
  #                       provider is loaded, and says so explicitly when not).
  #   * web-search-stub   provider `stub`: DETERMINISTIC fixtures, NO network.
  #                       The offline default, marked `stub: true` in every
  #                       answer. Used by the tests and by a deployment that
  #                       has no engine credential yet.
  #   * web-search-tavily provider `tavily`: the REAL HTTP engine
  #                       (POST https://api.tavily.com/search). Its key is the
  #                       CREDENTIAL NAME `credential` below, resolved at call
  #                       time through ctx.credentials - never a literal value
  #                       here. Availability is a LOCAL check (is the credential
  #                       resolvable?), never a network call.
  #   * web-search-searxng provider `searxng`: the REAL engine that needs NO
  #                       credential by itself - a SearXNG instance's JSON API
  #                       (GET <baseUrl>/search?format=json). It is the key-free
  #                       real path: point `baseUrl` at a JSON-enabled instance
  #                       (self-hosted). Every PUBLIC instance probed on
  #                       2026-09-20 refuses that API, which is WHY the dev
  #                       roster keeps `provider: stub`. `credential` is
  #                       OPTIONAL (a NAME) for a protected instance.
  #   * web-search-tools  the CONSUMER: the tools 'web search' and
  #                       'web search providers'.
  #
  # SELECTION (see core/web-search-impl): the engine named in `engine:` is
  # FORCED; otherwise `provider` runs and, when it is not USABLE, the
  # `fallback` chain is tried in order. A provider that is usable but FAILS
  # (auth, rate limit, network) does NOT fall through: the typed error is
  # returned. Every answer carries `engine` and `provider`, so a caller always
  # knows WHICH engine answered (a stub answer also carries `stub: true`).
  web-search-impl:
    # The engine a call that does not force one gets: `stub` is the OFFLINE
    # default (deterministic fixtures, marked `stub: true`, no socket opened) and
    # is what a deployment with no engine credential can answer with today.
    # A REAL engine is ONE config line away, no code change:
    #   * `provider: searxng` + `plugins.web-search-searxng.baseUrl` pointing at a
    #     JSON-ENABLED instance - a self-hosted one: every PUBLIC instance probed
    #     on 2026-09-20 refuses the JSON API (searx.be answers HTML, the others
    #     429/403), so the shipped default url is not a working search backend;
    #   * `provider: tavily` once a TAVILY_API_KEY credential exists.
    # `fallback` is tried IN ORDER when the configured engine is not USABLE; a
    # usable engine that FAILS returns its typed error instead of falling
    # through, so an empty chain is the honest setting here.
    provider: stub
    fallback: []
    # Results per call: the default a call that names no `count` gets, and the
    # HARD ceiling a call can never exceed (a larger `count` is capped AND the
    # answer says `truncated: true` with the spill path).
    count: 5
    maxCount: 20
    # Hand the results beyond the inline cap to `spill@1` instead of losing
    # them (false: report `truncated` and no spill path).
    spill: true
  # The STUB engine: `results` fixtures per query, deterministic, urls under
  # `.stub.invalid` (RFC 6761 reserved), NO socket opened. `unavailable: true`
  # simulates a deployment where the engine cannot run and `failWith` a typed
  # failure - both are how the negative controls are exercised.
  web-search-stub:
    results: 3
  # The REAL engine. It stays mounted and is UNUSABLE until a credential named
  # `TAVILY_API_KEY` (see `credential` below) exists in the deployment's credential
  # store (the workbench-secrets/credentials.yml file provider, or the
  # environment) - `web search providers` reports exactly that, and the selection
  # falls through to `stub`. No key is ever written here.
  web-search-tavily:
    credential: TAVILY_API_KEY
    # includeAnswer: false keeps the answer to the normalized result list; the
    # raw vendor response is never returned to a caller.
    includeAnswer: false
    maxResults: 20
    timeoutMs: 15000
  # The REAL engine that needs NO credential: a SearXNG instance's JSON API
  # (GET <baseUrl>/search?format=json). MEASURED 2026-09-20: every PUBLIC
  # instance probed refuses that API (searx.be answers HTML, the others 429/403),
  # so point `baseUrl` at your OWN instance for a working real search. The
  # engine's HTTP path is covered by the mocked-fetch tests in this repo; a live
  # call against a refusing public instance fails by design and says so.
  # `credential` is OPTIONAL: a NAME resolved through credentials@1 and sent as a
  # bearer token for a protected instance. No key is ever written here.
  web-search-searxng:
    baseUrl: https://searx.be
    timeoutMs: 15000
    maxResults: 20
  # The CONSUMER: the tools 'web search' and 'web search providers'.
  web-search-tools: {}

  # The COMPUTER-USE seam (definitions/computer-use.ts, contract
  # `computer-use@1`), modelled on the DeepSeek harness `computer-use` group
  # (MIT, see THIRD_PARTY.md): a desktop an agent can DRIVE - screenshot,
  # pointer, keyboard, windows, clipboard - with NO host change, because the
  # driver can OWN a headless display.
  #   * computer-use-impl  the SERVICE HOST (`registry`): the driver registry,
  #                        the selection (named provider -> configured default
  #                        -> ordered fallback -> the single usable driver),
  #                        the bounds of one call (screenshot byte cap,
  #                        deadline, clipboard inline cap) and the optional
  #                        sandbox@1 gate. It imports NO driver and touches no
  #                        desktop, so it runs with `execution: none`.
  #   * computer-use-x11   the X11 DRIVER (`x11`): screenshot (full screen or
  #                        region), pointer (move/click/drag/scroll), keyboard
  #                        (type/chords), clipboard read/write and window
  #                        list/focus/close/launch/wait. `target: xvfb` STARTS
  #                        an owned display (killed by the disposer, optionally
  #                        with `openbox`); `target: existing` attaches to
  #                        `display`/$DISPLAY and owns nothing. `runner: docker`
  #                        runs every binary inside `container` through
  #                        `docker exec`, so the desktop is disposable.
  #                        Every binary (xdpyinfo, xdotool, import, xclip,
  #                        wmctrl) is PROBED: an action the target cannot serve
  #                        is a typed `computer-use.not-implemented` /
  #                        `computer-use.no-display` naming the missing half,
  #                        never a fake success.
  #   * computer-use-tools the CONSUMER: the ONE action-enum tool `computer`
  #                        (providers | open | screen | screenshot | act |
  #                        window | wait | close). A screenshot answers a PATH
  #                        plus mime/size (byte-capped), never base64.
  computer-use-impl:
    provider: x11
    maxImageBytes: 8388608
    timeoutMs: 15000
  # The dev roster OWNS a display: the host of this stack has no X server, so
  # `target: xvfb` is what makes the seam usable here. Flip to
  # `target: existing` (and drop `xvfb`) to drive a real desktop, or keep
  # `target: xvfb` and set `runner: docker` + `container: <name>` to run the
  # whole toolchain inside a disposable container instead of on the host.
  # The binaries the driver needs (install with
  # `apt-get install -y xvfb x11-utils xdotool imagemagick xclip wmctrl openbox`):
  # xdpyinfo, xdotool, import (ImageMagick), xclip, wmctrl, plus Xvfb and a WM.
  computer-use-x11:
    target: xvfb
    runner: local
    xvfb:
      display: ':99'
      width: 1280
      height: 800
      depth: 24
    windowManager: openbox
    screenshotDir: /opt/workspace/workbench-plugins/.workbench/computer-use
  computer-use-tools: {}
  # The BROWSER-USE seam (definitions/browser-use.ts, contract `browser-use@1`),
  # modelled on the DeepSeek harness `browser-use` group (MIT, see
  # THIRD_PARTY.md): an agent DRIVES a real browser - navigate, snapshot with
  # stable element refs, click/type/select/hover/scroll/press/upload, JS eval,
  # readable extract (recipe-aware), screenshots as FILES, tabs, storage-state
  # reuse and waits - instead of every task re-implementing playwright.
  # It builds ON the existing web stack (`web-page`, `web-session`,
  # `web-recipe`) and shares the ONE chromium process with them through
  # `shared/browser.ts`; their behaviour and their tools are unchanged.
  #   * browser-use-impl        the SERVICE HOST (`registry`): the provider
  #                            registry, the selection (named provider ->
  #                            configured default -> ordered fallback -> the
  #                            single usable provider), the bounds of one call
  #                            (deadline, navigation/action timeouts, snapshot
  #                            node cap, text cap, screenshot byte cap, session
  #                            cap) and the optional sandbox@1 gate. It imports
  #                            no provider and starts no browser, so it declares
  #                            `execution: none`.
  #   * browser-use-playwright the PLAYWRIGHT PROVIDER (`playwright`): launches
  #                            chromium through the SHARED launcher, isolates one
  #                            browser CONTEXT per session, persists the storage
  #                            state per session, observes requests/downloads and
  #                            answers the DSH-style "snapshot + ref" model (an
  #                            `act` takes the `ref` a previous `snapshot`
  #                            answered; a ref of an older snapshot is a typed
  #                            `browser-use.stale-ref`). A missing browser is a
  #                            typed `browser-use.no-browser` naming the exact
  #                            requirement - never a silent fetch pretending to be
  #                            a browser.
  #   * browser-use-tools       the CONSUMER: the ONE action-enum tool `browser`
  #                            (providers | capabilities | sessions | open |
  #                            navigate | snapshot | act | evaluate | extract |
  #                            screenshot | tabs | wait | observe | state | close).
  browser-use-impl:
    provider: playwright
    maxImageBytes: 8388608
    timeoutMs: 60000
    maxSessions: 4
  # THE DEPLOYMENT SHAPE (thread 2632): the browser is a SEPARATE SERVICE of the
  # stack, never part of the workbench image. `docker compose --profile browser
  # up -d browser` starts the compose service `browser` (published image
  # ghcr.io/nexuslbs/workbench-plugins/browser:<tag>; the DEV overlay builds the
  # SAME Dockerfile from this repository's `browser/` directory and tags it
  # local/workbench-browser:latest, which is why `image` below names that local
  # tag). The provider ATTACHES to the service's CDP endpoint, reachable as
  # `browser:9222` on the stack network.
  #
  # With `browserService` set the provider NEVER launches a local browser and
  # NEVER falls back to an HTTP fetch: when nothing answers at the endpoint a call
  # fails with the typed `browser-use.no-browser` naming the endpoint and the
  # image, which is exactly what an operator needs to start the service.
  # `executablePath` is therefore DELIBERATELY ABSENT: in attach mode it is dead
  # config, and keeping it would let a local chromium hide a stopped service.
  browser-use-playwright:
    # HEADFUL is the DEPLOYED default. `headless` is a LAUNCH-time setting, and in
    # this attach deployment the browser service image owns the launch: it runs a
    # REAL headful chromium on its own Xvfb display (browser/start-browser.sh),
    # because a headless chromium is refused by Cloudflare-protected origins even
    # after the validator passes the challenge. `false` here keeps the config and
    # the running browser in agreement (a local launch - no `browserService` -
    # must be headful for the same reason).
    headless: false
    viewport:
      width: 1280
      height: 800
    browserService:
      endpoint: http://browser:9222
      image: local/workbench-browser:latest
    storageStateDir: /opt/workspace/workbench-plugins/.workbench/browser-use/state
    screenshotDir: /opt/workspace/workbench-plugins/.workbench/browser-use/shots
  browser-use-tools: {}

  # The per-domain RECIPE STORE (see plugins/web-recipe/README.md): durable,
  # agent-agnostic knowledge about a site (read path, named selectors,
  # discovered JSON endpoints, login flow by credential NAME, quirks) in ONE
  # human-readable JSON file per domain. It PROVIDES the cordis service
  # `web-recipe` (contract web-recipe@1) that web-page consumes, and registers
  # the tools 'recipe get', 'recipe save', 'recipe list', 'recipe delete' and
  # 'recipe verify'. `.workbench/` is git-ignored, so recipes are local state.
  web-recipe:
    dir: /opt/workspace/workbench-plugins/.workbench/web-recipe
    minConfidence: 0.2
    maxAgeDays: 0
    demoteOnFailure: true
    demoteStep: 0.2
    acceptRecords: true
    verifyTimeoutMs: 10000

  # The SESSION tool (see plugins/web-session/README.md): ONE multiplexed
  # browser tool `session` with an ACTION ENUM (open | act | read | close)
  # instead of one tool per browser verb - the tool schema is paid for in every
  # prompt, so the surface stays small. It keeps a per-site playwright context
  # whose storage state (cookies + localStorage) is PERSISTED to
  # `<stateDir>/state/<label>.json` (git-ignored, 0600) so a session survives a
  # process restart; an expired session is re-established from the `credential`
  # NAMEs of its declared login flow (resolved at login time through
  # ctx.credentials, never logged, echoed or persisted). `act` answers a DELTA
  # (what changed) instead of the page, `read` takes a CSS/XPath/role+name
  # selector (or returns a bounded outline), and `read {api: "list"}` exposes the
  # site's discovered JSON/XHR endpoints so a follow-up read can call the API
  # directly. It shares chromium with web-page through plugins/web-shared, so the
  # two plugins never launch two browsers. No per-site knowledge is hardcoded
  # here: `sites` is the whole site table.
  web-session:
    stateDir: /opt/workspace/workbench-plugins/.workbench/web-session
    idleTtlSeconds: 900
    maxSessions: 4
    defaultSite: demo
    sites:
      # `demo` is the LOCAL SPA fixture the end-to-end gate serves
      # (/opt/workspace/tmp/<task>/server.mjs): a login form, a JSON API and a
      # JS-rendered list. Point `baseUrl` at a real site for a real deployment;
      # the login flow below is config, not code, and the two credential NAMEs
      # resolve through the credentials provider (the operator puts them in the
      # gitignored workbench-secrets/credentials.yml).
      demo:
        baseUrl: http://127.0.0.1:12538/
        login:
          url: /login
          indicator: '#login-form'
          fields:
            - name: user
              selector: '#user'
              credential: WBSESSION_USER
            - name: pass
              selector: '#pass'
              credential: WBSESSION_PASSWORD
          submit: '#submit'
          success:
            selector: '#app'

      # meta.discourse.org (Discourse Meta) - the REAL site the `session` tool is
      # driven against. There is deliberately NO declared `login` flow: Discourse
      # sends an emailed login link and the account has TOTP 2FA enabled, so the
      # flow is driven step by step with `act` (see the `website-access` skill,
      # `discourse-meta-access.md`). The storage state defaults to
      # `<stateDir>/state/<label>.json`, so a session is REUSED across tool calls
      # and survives a process restart; it holds cookies only, never a credential.
      discourse-meta:
        baseUrl: https://meta.discourse.org/
      # forum.mattermost.com (the OFFICIAL Mattermost forum, a Discourse site).
      mattermost-forum:
        baseUrl: https://forum.mattermost.com/

  # The plugin of the EXTERNAL GIT source (`workbench-plugins-git`, subdir
  # `examples`): cloned from GitHub at boot, so naming it here is what keeps the
  # real clone path exercised in dev.
  git-source-demo: {}

  # The EMAIL capability (core docs/PLUGIN-CONTRACT.md 4e): the PROVIDER below
  # implements `email@1` on top of the himalaya CLI, the CONSUMER exposes it as
  # the tools 'email accounts', 'email list', 'email get' and 'email code'.
  # The accounts are placeholders: himalaya itself must be installed AND those
  # mailboxes configured with `himalaya account configure <name>` (see
  # core/email-himalaya/README.md). `credential` is a NAME, resolved at call
  # time through ctx.credentials; no value is ever written here.
  email-himalaya:
    defaultAccount: personal
    accounts:
      personal:
        address: me@example.com
        accountName: personal
        credential: EMAIL_PERSONAL_PASSWORD
      work:
        address: me@work.example
        accountName: work
  email-tools:
    defaultLimit: 10

  # THE TRANSPORT PROVIDERS of the general-service stack (definitions/*.ts +
  # docs/SERVICES.md): ONE plugin per transport, each declaring its capability
  # provider id in its manifest. They are independent: a deployment loads only
  # the transports it uses, the config-driven dispatcher below resolves by type.
  # `shell-impl` is the ONLY provider that executes on the WORKBENCH HOST and it
  # is OPT-IN: drop its row and `local` stops working while every remote type
  # keeps working (core/shell-impl/README.md).
  shell-impl: {}
  ssh-impl: {}
  docker-impl: {}
  http-impl: {}
  # THE CONFIG-DRIVEN DISPATCHER (general-service@1): resolves the transport
  # service from the configured `type` (local -> shell, container -> docker,
  # ssh -> ssh, ssh+container -> ssh + docker, http -> http) and calls it. NO
  # hard injection: transports it does not use need not be loaded at all.
  general-service-impl: {}
  # THE HIMALAYA PROVIDER (himalaya@1): it owns the TRANSPORT and never the mail
  # accounts (those belong to the email plugin). `type: container` runs himalaya
  # INSIDE the omni toolbox of this stack; project_dir/service come from HERE,
  # never from code: `${env:OMNI_DIR}` is the omni root of the deployment (the
  # container transport needs docker@1 + a reachable compose project).
  himalaya-impl:
    general:
      type: container
      params:
        engine: docker-compose
        compose:
          project_dir: ${env:OMNI_DIR}
          service: toolbox

  # The TOTP capability (core docs/PLUGIN-CONTRACT.md 4f): the PROVIDER below
  # implements `totp@1` with RFC 4226 (HOTP) + RFC 6238 (TOTP) on `node:crypto`
  # HMAC only (no dependency), the CONSUMER exposes it as the tools
  # 'totp list' (labels + metadata, never a secret) and 'totp code'.
  #
  # NO KEY VALUE IS IN THIS FILE. `credential: NAME` is a credential NAME,
  # resolved at CALL time through ctx.credentials, so a credential that is not in
  # the store leaves the plugin LOADED and only THAT entry 'not configured' (a
  # call for it reports the reason). The `${cred:NAME}` spelling is supported too
  # and is the PREFERRED form when the credential is guaranteed to exist: the
  # core expands it BEFORE the plugin loads (plugin README, "Configuration").
  # `rfc-test-vector` carries the PUBLIC RFC 6238 appendix B test key, which is
  # not a credential at all: it keeps the seam demonstrable with an empty store.
  totp-rfc6238:
    entries:
      github:
        credential: TOTP_GITHUB_KEY
        issuer: GitHub
        account: me@example.com
      aws-root:
        credential: TOTP_AWS_ROOT_KEY
        issuer: AWS
        account: root
      rfc-test-vector:
        secret: GEZDGNBVGY3TQOJQGEZDGNBVGY3TQOJQ
        issuer: RFC 6238
        account: appendix-b
        digits: 8
  totp-tools:
    reportEntryMetadata: true

  # The SMS capability (core docs/PLUGIN-CONTRACT.md 4g): the PROVIDER below
  # implements `sms@1` READ-ONLY on the Twilio REST API 2010-04-01 (Messages
  # resource, GET only - no sending, no webhook, no number provisioning), the
  # CONSUMER exposes it as the tools 'sms numbers', 'sms list', 'sms get' and
  # 'sms code'.
  #
  # The numbers are placeholders and NO TOKEN VALUE IS IN THIS FILE: `authToken`
  # is a credential NAME, resolved at CALL time through ctx.credentials. The
  # `${cred:NAME}` spelling is supported too (the plugin resolves both forms) and
  # is preferred when the credential is GUARANTEED to exist: the core expands it
  # BEFORE the plugins load, and a missing one aborts the boot - which is why the
  # rows below, like the totp/email rows, use the plain NAME form so the dev
  # config boots with an empty credential store. The required credential NAMES are
  # TWILIO_PERSONAL_TOKEN and TWILIO_WORK_TOKEN; with them absent the plugin
  # stays LOADED and reports every number `configured: false` - only a call for
  # one of them fails.
  sms-twilio:
    defaultNumber: personal
    numbers:
      personal:
        number: "+15551234567"
        accountSid: ACxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
        authToken: TWILIO_PERSONAL_TOKEN
        description: personal phone
      work:
        number: "+15557654321"
        accountSid: ACyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyy
        authToken: TWILIO_WORK_TOKEN
    timeoutMs: 8000
    maxPages: 3
  sms-tools:
    defaultListLimit: 10
    maxListLimit: 50
    includeBodies: true

  # The FILESYSTEM capability (definitions/fs.ts, docs/SERVICES.md): the
  # PROVIDER below serves `fs@1` on the LOCAL filesystem of the workbench host
  # (node:fs only, NO shell), the CONSUMER exposes it as the tools 'fs read',
  # 'fs write', 'fs append', 'fs str_replace', 'fs insert', 'fs apply_patch',
  # 'fs list', 'fs info', 'fs search' and 'fs grep'.
  #
  # `roots` is the SAFETY knob: READS are unrestricted (an agent asked to
  # diagnose a deployment must be able to look at it), WRITES are confined to
  # these directories - outside them a call fails with fs.outside-root, never
  # silently. Drop the `fs-local` row and every fs tool stops working while the
  # rest of the stack keeps running (core/fs-local/README.md). A loaded
  # `sandbox@1` provider is asked on EVERY read/write (never cached at apply
  # time, which would miss a provider applied later), so its policy narrows the
  # writes of this seam too. A DENY of the `fs` resource (`deny: true`, or a
  # fail-closed `unconfigured: deny` with no rule and no defaults) refuses the
  # READ as well as the WRITE, and an explicit `writeRoots: []` grants no write
  # at all (thread 2556).
  fs-local:
    cwd: ${env:OMNI_DIR}
    roots:
      - ${env:OMNI_DIR}
      - /tmp
    # engine `node` needs no binary and answers identically everywhere;
    # `ripgrep` with an absolute `binary` is the opt-in fast path.
    grep:
      engine: node
      maxResults: 250
  fs-tools: {}
  # ---------------------------------------------------------------------------
  # The LOCAL execution seams: `subprocess@1`, `jobs@1` and `spill@1`.
  #
  # Every command of these seams is an ARGV ARRAY handed to the OS on the
  # workbench host - no shell unless a call asks for `shell: true` - bounded by a
  # deadline that kills the whole process GROUP and by an output cap whose
  # overflow is handed to `spill@1` instead of being dropped.
  #
  # subprocess-local: provider `local-process` of `subprocess@1` - ONE bounded
  # run with streamed output. Drop the row and `subprocess run` fails with
  # subprocess.missing-service while the rest of the stack keeps running
  # (core/subprocess-local/README.md).
  subprocess-local:
    # Deadline and inline byte cap of a call that names none.
    timeoutMs: 30000
    maxOutputBytes: 65536
    # Bytes kept BEYOND the cap so the overflow can be spilled instead of lost.
    overflowBytes: 4194304
    # The single-shell escape hatch; `allowShell: false` refuses `shell: true`.
    allowShell: true
    # Hand output beyond the inline cap to `spill@1` (false truncates in place).
    spill: true
  # spill-local: provider `local-disk` of `spill@1` - oversized payloads written
  # ONCE under `dir` and read back by byte RANGE, with the retention policy
  # (max age / max total bytes). Default dir: <tmpdir>/workbench-spill inside the
  # service container; point it at a durable volume for a long-lived deployment.
  spill-local:
    dir: /tmp/workbench-spill
    maxBytes: 67108864
    maxTotalBytes: 268435456
    maxAgeSeconds: 86400
    previewBytes: 2048
    purgeOnWrite: true
  # jobs-local: provider `local-registry` of `jobs@1` - background jobs with a
  # stable id and a durable log under `dir` (default <tmpdir>/workbench-jobs),
  # read with a byte CURSOR. Unloading the plugin stops its jobs and removes
  # their logs.
  jobs-local:
    dir: /tmp/workbench-jobs
    maxJobs: 32
    maxLogBytes: 8388608
    stopOnUnload: true
  # The consumers: they expose the three seams as tools and hold no state of
  # their own.
  subprocess-tools: {}
  spill-tools: {}
  jobs-tools: {}

  # ---------------------------------------------------------------------------
  # The SANDBOX capability (`sandbox@1`, definitions/sandbox.ts): the POLICY layer
  # the other local capabilities consult before they touch the host - fs (path
  # roots), subprocess/jobs (argv, cwd, env, limits) and the future
  # computer-use / browser-use plugins (target, network). They reach it as
  # `ctx.sandbox`; a deployment without a provider keeps booting and every
  # consumer degrades to "no policy handle".
  #
  # TWO providers ship with this repository and EXACTLY ONE is mounted: they
  # register the SAME service, so swapping them is a CONFIG edit and no consumer
  # changes (see docs/SERVICES.md, "Sandbox capability").
  #   * sandbox-policy  (provider `declarative`): DECIDES only. Per-resource
  #     rules from THIS file, no host access, no `exec`: one decision = one
  #     allow-with-constraints or one deny with a machine-readable reason.
  #   * sandbox-enforce (provider `local-os`): DECIDES and ENFORCES. It probes
  #     the host for the strongest available mechanism (`bwrap` mount/pid/net
  #     namespaces, `unshare -n`, `prlimit`, the `/bin/sh` ulimit prologue,
  #     `setpriv`), runs the command under it and reports every constraint it
  #     could NOT enforce as a gap (see `sandbox policy`).
  #
  # The row below is the DECLARATIVE provider: the fail-closed reference the other
  # capabilities and the tests use. To ENFORCE instead, replace the
  # `sandbox-policy:` key with `sandbox-enforce:` carrying the same policy shape
  # (source / unconfigured / defaults / resources) plus the runner knobs
  # (`shell`, `timeoutMs`, `maxOutputBytes`); nothing else changes.
  #
  # The dev policy keeps the behaviour of the existing tools: `fs` keeps its own
  # roots and adds no READ confinement, `subprocess`/`jobs` run the commands they
  # always ran, and a resource WITHOUT a rule of its own (here `computer-use`,
  # `browser-use`, ...) inherits `defaults` above, which is already a strict
  # narrowing (no write outside the roots, no env beyond the allow-list, no
  # network); add a `resources:` rule for a resource to narrow it further.
  # `unconfigured: deny` REFUSES a resource only when the policy has no
  # `defaults` to fall back on - that is the fail-closed case (`sandbox.no-policy`).
  # The `fs` seam consumes this policy LAZILY (per read/write), so the
  # `resources.fs.writeRoots` below really confine `fs write` even though
  # `fs-local` applies first in discovery order (thread 2553); a DENY of the
  # `fs` resource (rule `deny: true`) refuses the read too.
  sandbox-policy:
    source: config.yml (dev)
    unconfigured: deny
    defaults:
      mode: workspace-write
      env:
        - PATH
        - HOME
        - LANG
        - LC_ALL
        - TZ
        - TMPDIR
        - TERM
        - SHELL
        - USER
        - LOGNAME
        - PWD
      network: none
      limits:
        wallTimeMs: 30000
        maxOutputBytes: 65536
        cpuSeconds: 30
        memoryBytes: 1073741824
        nofile: 256
    resources:
      fs:
        mode: workspace-write
        # No READ confinement of its own: `fs-local` already owns the read
        # policy and a sandbox policy can only make the seam STRICTER.
        readRoots: []
        writeRoots:
          - ${env:OMNI_DIR}
          - /tmp
      subprocess:
        # The dev host runs the commands its tools always ran; the limits and
        # the environment allow-list above still shape the call.
        mode: danger-full-access
      jobs:
        mode: danger-full-access
  # The consumers: `sandbox check` answers a request with the raw decision plus
  # the active policy, `sandbox policy` reports the policy and the enforcement
  # matrix, `sandbox run` runs a command through an ENFORCING provider, and
  # `sandbox guarded run` is the reference consumer that honours a deny.
  sandbox-tools: {}
  sandbox-consumer: {}

web:
  enabled: true
  # Inside the compose service the listener must not bind the container's
  # loopback only: the UI has no auth in this round, so the DEFAULT is
  # 127.0.0.1 and the dev service opts into 0.0.0.0 explicitly (and still needs
  # a published port to be reachable from the host).
  host: 0.0.0.0
  # 8080 is the container-INTERNAL port the workbench service always listens on;
  # publishing it on a host port is a deployment/overlay concern (the dev overlay
  # maps a host port onto this one), and the compose healthcheck probes `/health`
  # here. When the web port equals the
  # status port, `workbench serve` starts ONE listener that serves the browser UI
  # and answers `/health` on the same port, so the operator-visible URL is the
  # documented workbench port and nothing else has to be published.
  port: 8080
